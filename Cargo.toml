[package]
name = "tally"
version = "0.1.0"
edition = "2024"


[dependencies]
anyhow = "1.0.102"
bollard = "0.15"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
redis = { version = "1.2.0", features = ["aio", "connection-manager", "tokio-comp"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }
