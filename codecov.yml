codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

flags:
  rust:
    paths:
      - src/
      - tests/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true
