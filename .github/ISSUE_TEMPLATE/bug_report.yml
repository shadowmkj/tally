name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected behavior in Tally
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below to help us reproduce and resolve the issue quickly.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Tally is affected?
      options:
        - Frontend / Next.js Portal
        - Rust Code Evaluation Runner
        - Redis Queue / Worker Execution
        - Docker Container Driver (Python / Java / C / C++)
        - Database / Prisma ORM
        - CI/CD / GitHub Workflows
        - Other / General
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Submit code snippet '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Stack Traces
      description: Please copy and paste any relevant terminal output, browser console logs, or cargo/next.js error logs.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: OS version, Docker engine (Colima/Docker Desktop), Node/pnpm versions, etc.
      placeholder: |
        - OS: macOS / Ubuntu 24.04 / Windows 11
        - Docker Engine: Colima / Docker Desktop / Native
        - Node Version: v20.x
        - Rust Toolchain: 1.85+
